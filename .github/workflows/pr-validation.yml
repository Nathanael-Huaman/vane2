name: PR Validation

on:
  pull_request:
    branches:
      - dev
      - main
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - labeled
      - unlabeled

permissions:
  pull-requests: read
  issues: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate PR metadata
    runs-on: ubuntu-latest

    steps:
      - name: Validate linked issue and labels
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const errors = [];
            const body = pr.body || '';

            const issueMatch = body.match(/(?:Closes|Fixes|Resolves)\s+#(\d+)\b/i);
            if (!issueMatch) {
              errors.push('Add a closing keyword to the PR body, for example: `Closes #123`, `Fixes #123`, or `Resolves #123`.');
            }

            if (issueMatch) {
              const issueNumber = Number(issueMatch[1]);
              let issue;

              try {
                const response = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                });
                issue = response.data;
              } catch (error) {
                errors.push(`Linked issue #${issueNumber} could not be found or read. Confirm the issue exists in this repository and the PR body uses a valid closing keyword.`);
              }

              if (issue) {
                const issueLabels = issue.labels.map((label) =>
                  typeof label === 'string' ? label : label.name
                );

                if (!issueLabels.includes('status:approved')) {
                  errors.push(`Linked issue #${issueNumber} must have the \`status:approved\` label before this PR can be merged.`);
                }
              }
            }

            const typeLabels = pr.labels
              .map((label) => label.name)
              .filter((name) => name.startsWith('type:'));

            if (typeLabels.length !== 1) {
              errors.push(`Apply exactly one PR label that starts with \`type:\`. Found ${typeLabels.length}: ${typeLabels.length ? typeLabels.join(', ') : 'none'}.`);
            }

            if (errors.length) {
              core.setFailed(`PR validation failed:\n- ${errors.join('\n- ')}`);
            }
